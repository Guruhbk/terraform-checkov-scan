metadata:
  id: "CUSTOM_AWS_TAGS_001"
  name: "Ensure required tags are present"
  category: "CONVENTION"
  severity: "HIGH"

definition:
  and:
    - cond_type: attribute
      resource_types:
      - aws_s3_bucket
      - aws_security_group
      - aws_instance
      - aws_ebs_volume
      - aws_subnet
      - aws_vpc
      - aws_nat_gateway
      - aws_lb
      attribute: tags.Environment
      operator: exists

    - cond_type: attribute
      resource_types:
      - aws_s3_bucket
      - aws_security_group
      - aws_instance
      - aws_ebs_volume
      - aws_subnet
      - aws_vpc
      - aws_nat_gateway
      - aws_lb
      attribute: tags.Owner
      operator: exists

    - cond_type: attribute
      resource_types:
      - aws_s3_bucket
      - aws_security_group
      - aws_instance
      - aws_ebs_volume
      - aws_subnet
      - aws_vpc
      - aws_nat_gateway
      - aws_lb
      attribute: tags.Project
      operator: exists
